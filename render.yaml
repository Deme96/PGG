services:
  - type: web
    name: pgg-api
    runtime: node
    buildCommand: npm ci --include=dev && npm run build --workspace=Backend
    startCommand: npm run start --workspace=Backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PGG_ADMIN_PASSWORD
        sync: false
